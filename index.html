<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14212b;--mut:#5f7080;--line:#e2e8ee;--acc:#0f766e;--onacc:#fff;--side:#0c1a24;--P:#177245;--A:#c0392f;--L:#9a5b00;--E:#2754a8;--hl:#e5f3f0;--sh:0 1px 2px #14212b0d,0 8px 24px -16px #14212b33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,Segoe UI,Arial,sans-serif}
h1,h2,h3{margin:0 0 .6rem;line-height:1.2}h2{font-size:1.5rem}h3{font-size:1.1rem}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--side);color:#e6edf3;padding:1rem .8rem;display:flex;flex-direction:column;gap:.2rem}
.brand{font-weight:700;font-size:1.05rem;padding:.3rem .6rem 1rem}
.side button{all:unset;cursor:pointer;padding:.55rem .7rem;border-radius:6px;color:#c5d1dc}

.stat b{display:block;font-size:1.8rem;line-height:1.1}.stat span{color:var(--mut);font-size:.9rem}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:700}
input,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.45rem .6rem;min-width:0}
label{display:block;margin-bottom:.7rem;font-size:.9rem;color:var(--mut)}label input,label select{display:block;width:100%;margin-top:.2rem;color:var(--ink)}
button.pri,button.ghost,button.del{font:inherit;cursor:pointer;border-radius:6px;padding:.45rem .9rem;border:1px solid var(--acc)}
button.pri{background:var(--acc);color:#fff}button.ghost{background:none;color:var(--acc)}button.del{background:none;color:var(--A);border-color:var(--A)}
button.sm{padding:.2rem .55rem;font-size:.85rem}
:focus-visible{outline:3px solid var(--E);outline-offset:2px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end;margin-bottom:.9rem}.row>label{margin:0}.sp{flex:1}

.Present{color:var(--P)}.Absent{color:var(--A)}.Late{color:var(--L)}.Excused{color:var(--E)}
.opt{display:inline-flex;gap:.25rem;align-items:center;margin-right:.8rem;font-size:.9rem}
.bars{display:flex;gap:.5rem;align-items:end;height:130px}.bars div{flex:1;text-align:center;font-size:.75rem;color:var(--mut)}

.auth{min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;padding:1rem}.auth>.card{width:100%;max-width:380px;margin:0}.auth h2{text-align:center}.tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.err{color:var(--A);min-height:1.3em;font-size:.9rem}.hint{color:var(--mut);font-size:.85rem}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:min(420px,92vw)}
dialog::backdrop{background:#0008}
#toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem 1rem;border-radius:6px;display:none;z-index:9}
.empty{color:var(--mut);padding:1rem 0}
.top{display:none}main{min-width:0;margin:0 auto}.tabs button{flex:1}.opt input{display:inline-block;width:auto;margin:0}

body{font-family:Figtree,system-ui,Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;letter-spacing:-.02em}
h2{font-size:1.7rem;font-weight:700;margin-bottom:1rem}h3{font-weight:700}
.side{background:linear-gradient(180deg,var(--side),color-mix(in srgb,var(--side) 82%,var(--acc)));padding:1.3rem .85rem}
.brand,.logo{font-weight:700}

.card{border-radius:14px;box-shadow:var(--sh);padding:1.25rem}
.stat b{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:2.1rem;font-weight:700;letter-spacing:-.03em}

input,select{border-radius:10px;padding:.62rem .8rem;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
label{font-weight:600}
button.pri,button.ghost,button.del{border-radius:10px;font-weight:700;padding:.6rem 1.1rem;transition:background .15s,transform .15s,opacity .15s}
button.sm{padding:.28rem .7rem;font-size:.85rem}
button.pri{color:var(--onacc)}button.pri:hover{filter:brightness(1.08);transform:translateY(-1px)}
button.ghost:hover{background:var(--hl)}button.del:hover{background:color-mix(in srgb,var(--A) 10%,transparent)}

th{font-size:.82rem}tbody tr:hover{background:var(--hl)}
.tag{border:0;background:color-mix(in srgb,currentColor 13%,transparent);padding:.12rem .7rem}
.bars i{background:var(--acc);border-radius:8px 8px 3px 3px;opacity:.9}
dialog{border:0;border-radius:18px;padding:1.4rem;box-shadow:0 30px 80px -20px #000a}
dialog::backdrop{background:#0a1220b0;backdrop-filter:blur(4px)}

.auth>.card{max-width:420px;padding:2rem 1.8rem;border-radius:22px;box-shadow:0 30px 70px -30px #14212b55}
.auth .logo{width:52px;height:52px;border-radius:16px;font-size:1.5rem;margin:0 auto .9rem}
.auth h2{font-size:1.5rem;margin-bottom:.3rem}
.sub{text-align:center;color:var(--mut);margin:0 0 1.4rem;overflow-wrap:anywhere}.sub b{color:var(--ink)}

.otp input:not(:placeholder-shown){border-color:var(--acc);background:var(--hl)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:760px){
.app{grid-template-columns:1fr}
.top{display:flex;justify-content:space-between;align-items:center;gap:.6rem;background:var(--side);color:#fff;padding:.6rem 1rem;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top button{font:inherit;color:#fff;background:#ffffff22;border:0;border-radius:6px;padding:.5rem .8rem;min-height:40px;cursor:pointer;flex:none}
.side{display:none;padding:.5rem 1rem 1rem}body.nav .side{display:flex}
.brand{display:none}
.side button{min-height:44px;display:flex;align-items:center}
.side .who{margin:.5rem 0 0}
main{padding:1rem .9rem 2rem}
h2{font-size:1.3rem}.card{padding:.85rem}.stat b{font-size:1.5rem}
.row{flex-direction:column;align-items:stretch}.row>label,.row>button{width:100%}.sp{display:none}
button.pri,button.ghost,button.del{min-height:44px}button.sm{min-height:40px}
.wrap{overflow:visible}
table,tbody{display:block}thead{display:none}
tr{display:block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem;margin-bottom:.7rem}
td{display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.4rem 0;border:0;border-top:1px solid var(--line);white-space:normal;overflow-wrap:anywhere;min-width:0;text-align:right}
td::before{content:attr(data-l);flex:none;color:var(--mut);font-size:.85rem;text-align:left}
td:empty{display:none}
td:first-child{display:block;border-top:0;padding-top:.1rem;font-weight:700;font-size:1.02rem;text-align:left}td:first-child::before{display:none}
td:has(.opt){display:block;text-align:left}td:has(.opt)::before{display:block;margin-bottom:.1rem}
td[data-l=""]{display:flex;justify-content:stretch;gap:.5rem}td[data-l=""]::before{display:none}td[data-l=""] button{flex:1}
.grid>.card:last-child:nth-child(odd){grid-column:1/-1}
.opt{display:inline-flex;align-items:center;gap:.4rem;min-height:44px;padding:0 .8rem;margin:.3rem .4rem 0 0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.opt:has(input:checked){border-color:var(--acc);background:var(--hl);font-weight:700}
.opt input{width:1.2rem;height:1.2rem}
.bars{gap:.3rem}.bars div{font-size:.68rem}
dialog{max-height:88vh;overflow:auto}
#toast{width:max-content;max-width:90vw;text-align:center}
}
</style></head>
<body><div id="root"></div><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const ST=['Present','Absent','Late','Excused'];
function seed(){let s=7;const r=()=>(s=(s*9301+49297)%233280)/233280;
const names=['Ana Reyes','Ben Santos','Carla Dizon','Dino Cruz','Ella Garcia','Fred Lim','Gina Torres','Hugo Ramos','Iris Bautista','Jon Mercado'];
const D={users:[{id:1,name:'System Admin',email:'admin@school.ph',pass:'admin123',role:'admin'},{id:2,name:'Teacher Demo',email:'teacher@school.ph',pass:'teacher123',role:'teacher'},{id:3,name:'Ana Reyes',email:'student@school.ph',pass:'student123',role:'student',studentId:101}],
classes:[{id:1,name:'BSIT 2A',tid:2},{id:2,name:'BSIT 2B',tid:2}],students:[],att:[],settings:{school:'Demo College',risk:3}};
names.forEach((n,i)=>D.students.push({id:101+i,no:'2024-'+String(1001+i),name:n,cid:i<5?1:2}));
let d=new Date(),n=0;while(n<10){d.setDate(d.getDate()-1);if(d.getDay()%6){const ds=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);n++;
D.students.forEach(st=>{const x=r();D.att.push({id:uid()+D.att.length,date:ds,cid:st.cid,sid:st.id,status:x<.78?'Present':x<.88?'Late':x<.95?'Absent':'Excused'})})}}return D}
const load=()=>{try{return JSON.parse(localStorage.getItem('sams1'))}catch(e){return null}};
let D=load()||seed();const save=()=>{try{localStorage.setItem('sams1',JSON.stringify(D))}catch(e){}};
let me=null,page='dash',mode='login',err='';
try{const i=sessionStorage.getItem('sams_me');me=D.users.find(u=>u.id==i)||null}catch(e){}
const F={from:'',to:'',cid:'',st:'',q:''},A={cid:'',date:today()};
const NAV={admin:['dash','att','hist','rep','stu','cls','usr','set','pro'],teacher:['dash','att','hist','rep','stu','pro'],student:['dash','hist','pro']};
const NM={dash:'Dashboard',att:'Take attendance',hist:'Attendance history',rep:'Reports',stu:'Students',cls:'Classes',usr:'Users & teachers',set:'System settings',pro:'My profile'};
const myClasses=()=>me.role==='admin'?D.classes:D.classes.filter(c=>c.tid==me.id);
const cname=id=>(D.classes.find(c=>c.id==id)||{name:'—'}).name;
const sname=id=>(D.students.find(s=>s.id==id)||{name:'(removed)'}).name;
const tag=s=>`<span class="tag ${s}">${s}</span>`;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}
function scope(){let r=D.att;if(me.role==='student')return r.filter(a=>a.sid==me.studentId);if(me.role==='teacher'){const ids=myClasses().map(c=>c.id);r=r.filter(a=>ids.includes(a.cid))}return r}
const cnt=r=>{const o={Present:0,Absent:0,Late:0,Excused:0};r.forEach(a=>o[a.status]++);return o};
const rate=c=>{const t=c.Present+c.Late+c.Absent;return t?Math.round((c.Present+c.Late)/t*100)+'%':'—'};
function form(title,fs,cb){const d=document.createElement('dialog');
d.innerHTML=`<form><h3>${title}</h3>${fs.map(f=>`<label>${f.l}${f.o?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}"${o[0]==f.v?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}" required>`}</label>`).join('')}<div class="row"><button type="button" class="ghost">Cancel</button><button class="pri">Save changes</button></div></form>`;
document.body.append(d);d.querySelector('.ghost').onclick=()=>d.close();
d.querySelector('form').onsubmit=e=>{e.preventDefault();if(cb(Object.fromEntries(new FormData(e.target)))!==false)d.close()};d.onclose=()=>d.remove();d.showModal()}
const tbl=(h,rows,empty)=>rows.length?`<div class="wrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td data-l="${esc(h[i])}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<p class="empty">${empty||'Nothing here yet.'}</p>`;
const clsOpts=(all)=>(all?[['','All classes']]:[]).concat(myClasses().map(c=>[c.id,c.name]));
const sel=(id,o,v,fn)=>`<select id="${id}" onchange="${fn}">${o.map(x=>`<option value="${esc(x[0])}"${x[0]==v?' selected':''}>${esc(x[1])}</option>`).join('')}</select>`;

/* ---------- auth + OTP ---------- */
const EJS={service:'service_3i1vdom',template:'template_bj0eivs',key:'YklWneFUbS5srtLoy'};
const OTP_TTL=300,RESEND=30,MAX_TRIES=5,SKIP_OTP_FOR_DEMO=true; /* set SKIP_OTP_FOR_DEMO=false when you go live */
const DEMO=['admin@school.ph','teacher@school.ph','student@school.ph'];
let otp=null,busy=false;
try{emailjs.init({publicKey:EJS.key})}catch(e){}
const genCode=()=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return String(a[0]%1e6).padStart(6,'0')};
const mask=e=>e.replace(/^(.{1,2}).*(@.*)$/,'$1•••$2');
const go=m=>{mode=m;err='';render()};
const TXT={login:['Welcome back','Log in to your account'],reg:['Create your account','We will email you a code to verify it'],forgot:['Forgot password?','Enter your email and we will send you a code'],reset:['Choose a new password','Use at least 6 characters'],otp:['Check your email','']};
function authView(){const m=mode,reg=m==='reg',t=TXT[m],sub=m==='otp'&&otp?`We sent a 6-digit code to <b>${esc(mask(otp.email))}</b>`:esc(t[1]);
const btn=(x,y)=>`<button class="pri" style="width:100%"${busy?' disabled':''}>${busy?'Sending code…':x}</button>`;
let body='';
if(m==='login'||m==='reg')body=`<div class="tabs"><button class="${reg?'ghost':'pri'}" onclick="go('login')">Log in</button><button class="${reg?'pri':'ghost'}" onclick="go('reg')">Register</button></div>
<form onsubmit="${reg?'doReg(event)':'doLogin(event)'}">${reg?`<label>Full name<input name="name" autocomplete="name" required></label>`:''}
<label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="pass" type="password" minlength="6" autocomplete="${reg?'new-password':'current-password'}" required></label>
${reg?`<label>Account type<select name="role" onchange="document.getElementById('sn').style.display=this.value==='student'?'block':'none'"><option value="teacher">Teacher</option><option value="student">Student</option></select></label><label id="sn" style="display:none">Student number<input name="no" placeholder="e.g. 2024-1001"></label>`:''}
<div class="err" role="alert">${esc(err)}</div>${btn(reg?'Send verification code':'Log in')}</form>${reg?'':`<div class="links"><button class="lnk" onclick="go('forgot')">Forgot password?</button></div>`}`;
else if(m==='forgot')body=`<form onsubmit="doForgot(event)"><label>Email<input name="email" type="email" autocomplete="email" required></label><div class="err" role="alert">${esc(err)}</div>${btn('Send code')}</form><div class="links"><button class="lnk" onclick="go('login')">Back to log in</button></div>`;
else if(m==='otp')body=`<div class="otp" oninput="otpIn(event)" onkeydown="otpKey(event)">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" placeholder=" " autocomplete="${i?'off':'one-time-code'}" aria-label="Digit ${i+1} of 6">`).join('')}</div>
<div class="err" role="alert">${esc(err)}</div><button class="pri" style="width:100%" onclick="otpCheck(1)">Verify code</button>
<div class="links"><button class="lnk" onclick="otp=null;go('login')">Use a different email</button><button class="lnk" id="rs" onclick="resend()">Resend code</button></div><p class="hint" style="text-align:center;margin:.9rem 0 0">The code expires in ${OTP_TTL/60} minutes. Check your spam folder if it does not arrive.</p>`;
else body=`<form onsubmit="doReset(event)"><label>New password<input name="p1" type="password" minlength="6" autocomplete="new-password" required></label><label>Confirm password<input name="p2" type="password" minlength="6" autocomplete="new-password" required></label><div class="err" role="alert">${esc(err)}</div><button class="pri" style="width:100%">Save new password</button></form>`;
return `<div class="auth"><div class="card"><div class="logo" aria-hidden="true">✓</div><h2 style="text-align:center">${t[0]}</h2><p class="sub">${sub}</p>${body}</div></div>`}
async function sendOtp(p,email,name,data){if(busy)return;busy=true;err='';render();const code=genCode();
try{await emailjs.send(EJS.service,EJS.template,{to_email:email,email:email,user_email:email,to_name:name,name:name,otp:code,passcode:code,code:code,app_name:'Attendance Monitoring System',minutes:OTP_TTL/60,time:new Date(Date.now()+OTP_TTL*1e3).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
otp={p,email,name,data,code,exp:Date.now()+OTP_TTL*1e3,tries:0,next:Date.now()+RESEND*1e3};mode='otp'}
catch(e){console.error(e);const why=(e&&(e.text||e.message))||String(e);err='We could not send the code. Reason: '+(typeof emailjs==='undefined'?'the EmailJS library did not load (blocked or offline).':why+(e&&e.status?' (code '+e.status+')':''))}
busy=false;render()}
const resend=()=>{if(otp&&Date.now()>=otp.next)sendOtp(otp.p,otp.email,otp.name,otp.data)};
const boxes=()=>[...document.querySelectorAll('.otp input')];
function otpIn(e){const b=boxes(),i=b.indexOf(e.target),d=e.target.value.replace(/\D/g,'');
if(d.length>1){d.slice(0,6-i).split('').forEach((c,k)=>b[i+k].value=c);b[Math.min(i+d.length,5)].focus()}else{e.target.value=d;if(d&&i<5)b[i+1].focus()}otpCheck()}
function otpKey(e){const b=boxes(),i=b.indexOf(e.target);if(e.key==='Backspace'&&!e.target.value&&i>0){b[i-1].value='';b[i-1].focus()}
if(e.key==='ArrowLeft'&&i>0)b[i-1].focus();if(e.key==='ArrowRight'&&i<5)b[i+1].focus()}
function otpCheck(manual){const v=boxes().map(x=>x.value).join('');if(v.length===6)verifyOtp(v);else if(manual){err='Enter all 6 digits.';render()}}
function verifyOtp(v){if(!otp)return;
if(Date.now()>otp.exp){err='That code has expired. Request a new one.';return render()}
if(v!==otp.code){otp.tries++;if(otp.tries>=MAX_TRIES){otp=null;mode='login';err='Too many wrong codes. Please start again.';return render()}err='Incorrect code. '+(MAX_TRIES-otp.tries)+' attempt(s) left.';return render()}
const o=otp;if(o.p==='login'){otp=null;return setMe(o.data)}
if(o.p==='reg'){otp=null;D.users.push(o.data);save();return setMe(o.data)}
go('reset')}
function afterAuth(){clearInterval(afterAuth.t);if(mode!=='otp'||!otp)return;const f=boxes()[0];f&&f.focus();
const tick=()=>{const b=$('#rs');if(!b||!otp){clearInterval(afterAuth.t);return}const s=Math.ceil((otp.next-Date.now())/1e3);b.disabled=s>0;b.textContent=s>0?'Resend in '+s+'s':'Resend code'};tick();afterAuth.t=setInterval(tick,1e3)}
function doLogin(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const u=D.users.find(u=>u.email.toLowerCase()===f.email.toLowerCase()&&u.pass===f.pass);
if(!u){err='Email or password is incorrect. Check both and try again.';return render()}
if(SKIP_OTP_FOR_DEMO&&DEMO.includes(u.email.toLowerCase()))return setMe(u);sendOtp('login',u.email,u.name,u)}
function doReg(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
if(D.users.some(u=>u.email.toLowerCase()===f.email.toLowerCase())){err='That email is already registered. Log in instead.';return render()}
const u={id:uid(),name:f.name,email:f.email.trim(),pass:f.pass,role:f.role};
if(f.role==='student'){const s=D.students.find(s=>s.no===(f.no||'').trim());if(!s){err='No student record matches that number. Ask your admin to add you first.';return render()}u.studentId=s.id}
sendOtp('reg',u.email,u.name,u)}
function doForgot(e){e.preventDefault();const em=new FormData(e.target).get('email').trim(),u=D.users.find(u=>u.email.toLowerCase()===em.toLowerCase());
if(!u){err='No account uses that email.';return render()}
if(DEMO.includes(u.email.toLowerCase())){err='Demo accounts cannot reset their password.';return render()}
sendOtp('forgot',u.email,u.name,u)}
function doReset(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
if(f.p1!==f.p2){err='The two passwords do not match.';return render()}
const u=D.users.find(x=>x.id==otp.data.id);if(!u){otp=null;return go('login')}u.pass=f.p1;save();otp=null;mode='login';err='';render();toast('Password updated. Log in with your new password.')}
function setMe(u){me=u;page='dash';err='';try{sessionStorage.setItem('sams_me',u.id)}catch(e){}render()}
function logout(){me=null;otp=null;mode='login';try{sessionStorage.removeItem('sams_me')}catch(e){}render()}

/* ---------- views ---------- */
function dash(){const r=scope(),c=cnt(r);
if(me.role==='student'){return `<h2>My attendance</h2><div class="grid">${ST.map(s=>`<div class="card stat"><b class="${s}">${c[s]}</b><span>${s}</span></div>`).join('')}<div class="card stat"><b>${rate(c)}</b><span>Attendance rate</span></div></div><div class="card"><h3>Recent records</h3>${tbl(['Date','Class','Status'],r.slice().sort((a,b)=>b.date<a.date?-1:1).slice(0,8).map(a=>[a.date,cname(a.cid),tag(a.status)]),'No attendance recorded for you yet.')}</div>`}
const cl=myClasses(),stu=D.students.filter(s=>cl.some(c=>c.id==s.cid)),t=r.filter(a=>a.date===today());
const dates=[...new Set(r.map(a=>a.date))].sort().slice(-7);
const bars=dates.map(d=>{const x=cnt(r.filter(a=>a.date===d)),p=parseInt(rate(x))||0;return `<div><i style="height:${p}px" title="${p}%"></i>${d.slice(5)}<br>${p}%</div>`}).join('');
const risk=stu.map(s=>{const x=cnt(r.filter(a=>a.sid==s.id));return{s,n:x.Absent+x.Late,x}}).filter(o=>o.n>=D.settings.risk).sort((a,b)=>b.n-a.n).slice(0,6);
return `<h2>Dashboard</h2><div class="grid"><div class="card stat"><b>${stu.length}</b><span>Students</span></div><div class="card stat"><b>${cl.length}</b><span>Classes</span></div><div class="card stat"><b>${t.length}</b><span>Records today</span></div><div class="card stat"><b>${rate(c)}</b><span>Overall attendance rate</span></div></div>
<div class="grid">${ST.map(s=>`<div class="card stat"><b class="${s}">${c[s]}</b><span>${s} (all time)</span></div>`).join('')}</div>
<div class="card"><h3>Attendance rate, last recorded days</h3>${bars?`<div class="bars">${bars}</div>`:'<p class="empty">No records yet. Take attendance to see trends.</p>'}</div>
<div class="card"><h3>Needs attention</h3><p class="hint">Students with ${D.settings.risk} or more absences and lates.</p>${tbl(['Student','Class','Absent','Late'],risk.map(o=>[esc(o.s.name),cname(o.s.cid),o.x.Absent,o.x.Late]),'No students are over the limit.')}</div>
<div class="card"><h3>Today (${today()})</h3>${tbl(['Class','Status'],cl.map(c=>[esc(c.name),t.some(a=>a.cid==c.id)?'Attendance taken':'<span class="hint">Not yet taken</span>']),'No classes assigned.')}</div>`}

function att(){const o=clsOpts();if(!A.cid||!o.some(x=>x[0]==A.cid))A.cid=o[0]?o[0][0]:'';
const head=`<h2>Take attendance</h2><div class="card"><div class="row"><label>Class${sel('ac',o,A.cid,"A.cid=this.value;render()")}</label><label>Date<input type="date" id="ad" value="${A.date}" max="${today()}" onchange="A.date=this.value;render()"></label><span class="sp"></span><button class="ghost" onclick="markAll()">Mark all present</button></div>`;
if(!A.cid)return head+'<p class="empty">No class available. Ask an admin to assign you a class.</p></div>';
const list=D.students.filter(s=>s.cid==A.cid),ex={};D.att.filter(a=>a.cid==A.cid&&a.date===A.date).forEach(a=>ex[a.sid]=a.status);
return head+(list.length?tbl(['Student','Status'],list.map(s=>[esc(s.name)+`<br><span class="hint">${esc(s.no)}</span>`,ST.map(t=>`<label class="opt"><input type="radio" name="s${s.id}" value="${t}"${(ex[s.id]||'')===t?' checked':''}>${t}</label>`).join('')])):'<p class="empty">This class has no students yet.</p>')+(list.length?`<div class="row" style="margin:1rem 0 0"><button class="pri" onclick="saveAtt()">Save attendance</button></div>`:'')+'</div>'}
function markAll(){document.querySelectorAll('input[value="Present"]').forEach(i=>i.checked=true)}
function saveAtt(){const list=D.students.filter(s=>s.cid==A.cid);let miss=0;const rec=[];
list.forEach(s=>{const c=document.querySelector(`input[name="s${s.id}"]:checked`);if(!c)miss++;else rec.push({id:uid()+s.id,date:A.date,cid:+A.cid,sid:s.id,status:c.value})});
if(miss){return toast(miss+' student(s) still need a status.')}
D.att=D.att.filter(a=>!(a.cid==A.cid&&a.date===A.date)).concat(rec);save();toast('Attendance saved for '+cname(A.cid)+', '+A.date)}

function histRows(){let r=scope();if(F.from)r=r.filter(a=>a.date>=F.from);if(F.to)r=r.filter(a=>a.date<=F.to);if(F.cid)r=r.filter(a=>a.cid==F.cid);if(F.st)r=r.filter(a=>a.status===F.st);
if(F.q)r=r.filter(a=>sname(a.sid).toLowerCase().includes(F.q.toLowerCase()));return r.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0)}
function histTbl(){const r=histRows(),st=me.role==='student';return `<p class="hint">${r.length} record(s)</p>`+tbl(st?['Date','Class','Status']:['Date','Student','Class','Status',''],r.slice(0,200).map(a=>st?[a.date,cname(a.cid),tag(a.status)]:[a.date,esc(sname(a.sid)),esc(cname(a.cid)),tag(a.status),`<button class="ghost sm" onclick="editStatus(${D.att.indexOf(a)})">Edit status</button>`]),'No records match these filters.')}
function editStatus(i){const a=D.att[i];if(!a)return;form('Edit status: '+esc(sname(a.sid))+', '+a.date,[{k:'status',l:'Status',o:ST.map(x=>[x,x]),v:a.status}],o=>{a.status=o.status;save();$('#ht').innerHTML=histTbl();toast('Status updated to '+a.status)})}
function filt(k,v){F[k]=v;$('#ht').innerHTML=histTbl()}
function hist(){const st=me.role==='student';return `<h2>Attendance history</h2><div class="card"><div class="row"><label>From<input type="date" value="${F.from}" onchange="filt('from',this.value)"></label><label>To<input type="date" value="${F.to}" onchange="filt('to',this.value)"></label>
${st?'':`<label>Class${sel('hc',clsOpts(1),F.cid,"filt('cid',this.value)")}</label>`}<label>Status${sel('hs',[['','All']].concat(ST.map(s=>[s,s])),F.st,"filt('st',this.value)")}</label>
${st?'':`<label>Search student<input type="search" value="${esc(F.q)}" oninput="filt('q',this.value)" placeholder="Name"></label>`}</div><div id="ht">${histTbl()}</div></div>`}

function repTbl(){let r=scope();if(F.from)r=r.filter(a=>a.date>=F.from);if(F.to)r=r.filter(a=>a.date<=F.to);
let st=D.students.filter(s=>myClasses().some(c=>c.id==s.cid));if(F.cid)st=st.filter(s=>s.cid==F.cid);
return tbl(['Student','Class','Present','Absent','Late','Excused','Rate','Flag'],st.map(s=>{const x=cnt(r.filter(a=>a.sid==s.id));return [esc(s.name),cname(s.cid),x.Present,x.Absent,x.Late,x.Excused,rate(x),x.Absent+x.Late>=D.settings.risk?'<span class="tag Absent">At risk</span>':'']}),'No students in this selection.')}
function rfilt(k,v){F[k]=v;$('#rt').innerHTML=repTbl()}
function rep(){return `<h2>Reports</h2><div class="card"><div class="row"><label>Class${sel('rc',clsOpts(1),F.cid,"rfilt('cid',this.value)")}</label><label>From<input type="date" value="${F.from}" onchange="rfilt('from',this.value)"></label><label>To<input type="date" value="${F.to}" onchange="rfilt('to',this.value)"></label></div>
<div id="rt">${repTbl()}</div><p class="hint">Rate = (Present + Late) ÷ (Present + Late + Absent). Excused days are not counted against the student. Students with ${D.settings.risk} or more absences and lates are flagged.</p></div>`}

let sq='';
function stuTbl(){const l=D.students.filter(s=>myClasses().some(c=>c.id==s.cid)&&(s.name+s.no).toLowerCase().includes(sq.toLowerCase()));
return tbl(['Student no.','Name','Class',''],l.map(s=>[esc(s.no),esc(s.name),cname(s.cid),`<button class="ghost sm" onclick="editStu(${s.id})">Edit</button> <button class="del sm" onclick="delStu(${s.id})">Delete</button>`]),'No students found.')}
function stu(){return `<h2>Students</h2><div class="card"><div class="row"><label>Search<input type="search" placeholder="Name or number" oninput="sq=this.value;$('#st').innerHTML=stuTbl()"></label><span class="sp"></span><button class="pri" onclick="editStu()">Add student</button></div><div id="st">${stuTbl()}</div></div>`}
function editStu(id){const s=D.students.find(x=>x.id==id)||{no:'',name:'',cid:myClasses()[0]?.id};if(!myClasses().length)return toast('Create a class first.');
form(id?'Edit student':'Add student',[{k:'no',l:'Student number',v:s.no},{k:'name',l:'Full name',v:s.name},{k:'cid',l:'Class',o:clsOpts(),v:s.cid}],o=>{
if(D.students.some(x=>x.no===o.no.trim()&&x.id!=id)){toast('That student number already exists.');return false}
if(id)Object.assign(s,{no:o.no.trim(),name:o.name.trim(),cid:+o.cid});else D.students.push({id:uid(),no:o.no.trim(),name:o.name.trim(),cid:+o.cid});save();render()})}
function delStu(id){if(!confirm('Delete this student and their attendance records?'))return;D.students=D.students.filter(s=>s.id!=id);D.att=D.att.filter(a=>a.sid!=id);save();render()}

function cls(){return `<h2>Classes</h2><div class="card"><div class="row"><span class="sp"></span><button class="pri" onclick="editCls()">Add class</button></div>${tbl(['Class / section','Teacher','Students',''],D.classes.map(c=>[esc(c.name),esc((D.users.find(u=>u.id==c.tid)||{name:'Unassigned'}).name),D.students.filter(s=>s.cid==c.id).length,`<button class="ghost sm" onclick="editCls(${c.id})">Edit</button> <button class="del sm" onclick="delCls(${c.id})">Delete</button>`]),'No classes yet.')}</div>`}
function editCls(id){const c=D.classes.find(x=>x.id==id)||{name:'',tid:''};form(id?'Edit class':'Add class',[{k:'name',l:'Class / section name',v:c.name},{k:'tid',l:'Teacher',o:[['','Unassigned']].concat(D.users.filter(u=>u.role==='teacher').map(u=>[u.id,u.name])),v:c.tid}],o=>{
if(id)Object.assign(c,{name:o.name.trim(),tid:o.tid?+o.tid:''});else D.classes.push({id:uid(),name:o.name.trim(),tid:o.tid?+o.tid:''});save();render()})}
function delCls(id){if(D.students.some(s=>s.cid==id))return toast('Move or delete this class\'s students first.');D.classes=D.classes.filter(c=>c.id!=id);D.att=D.att.filter(a=>a.cid!=id);save();render()}

function usr(){return `<h2>Users & teachers</h2><div class="card"><div class="row"><span class="sp"></span><button class="pri" onclick="editUsr()">Add user</button></div>${tbl(['Name','Email','Role',''],D.users.map(u=>[esc(u.name),esc(u.email),u.role,`<button class="ghost sm" onclick="editUsr(${u.id})">Edit</button> ${u.id==me.id?'':`<button class="del sm" onclick="delUsr(${u.id})">Delete</button>`}`]))}</div>`}
function editUsr(id){const u=D.users.find(x=>x.id==id)||{name:'',email:'',pass:'',role:'teacher'};
form(id?'Edit user':'Add user',[{k:'name',l:'Full name',v:u.name},{k:'email',l:'Email',t:'email',v:u.email},{k:'pass',l:'Password',t:'text',v:u.pass},{k:'role',l:'Role',o:[['admin','Admin'],['teacher','Teacher'],['student','Student']],v:u.role}],o=>{
if(D.users.some(x=>x.email.toLowerCase()===o.email.toLowerCase()&&x.id!=id)){toast('That email is already used.');return false}
if(id)Object.assign(u,o);else D.users.push({id:uid(),...o});save();render()})}
function delUsr(id){if(!confirm('Delete this user account?'))return;D.users=D.users.filter(u=>u.id!=id);D.classes.forEach(c=>{if(c.tid==id)c.tid=''});save();render()}

function set(){return `<h2>System settings</h2><div class="card" style="max-width:420px"><form onsubmit="saveSet(event)"><label>School name<input name="school" value="${esc(D.settings.school)}" required></label><label>At-risk limit (absences + lates)<input name="risk" type="number" min="1" value="${D.settings.risk}" required></label><button class="pri">Save changes</button></form></div>
<div class="card" style="max-width:420px"><h3>Reset demo data</h3><p class="hint">Replaces everything stored in this browser with the sample data.</p><button class="del" onclick="if(confirm('Reset all data?')){D=seed();save();logout()}">Reset all data</button></div>`}
function saveSet(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));D.settings={school:f.school.trim(),risk:+f.risk};save();toast('Settings saved');render()}

function pro(){return `<h2>My profile</h2><div class="card" style="max-width:420px"><form onsubmit="savePro(event)"><label>Full name<input name="name" value="${esc(me.name)}" required></label><label>Email<input name="email" type="email" value="${esc(me.email)}" required></label><label>New password (leave blank to keep)<input name="pass" type="password" minlength="6"></label><p class="hint">Role: ${me.role}</p><button class="pri">Save changes</button></form></div>`}
function savePro(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(D.users.some(u=>u.email.toLowerCase()===f.email.toLowerCase()&&u.id!=me.id))return toast('That email is already used.');
me.name=f.name.trim();me.email=f.email.trim();if(f.pass)me.pass=f.pass;save();toast('Profile saved');render()}

const V={dash,att,hist,rep,stu,cls,usr,set,pro};
function render(){const r=$('#root');if(!me){r.innerHTML=authView();afterAuth();return}
if(!NAV[me.role].includes(page))page='dash';
document.body.classList.remove('nav');r.innerHTML=`<div class="app"><header class="top"><b>${esc(D.settings.school)}</b><button onclick="document.body.classList.toggle('nav')" aria-label="Menu">☰ Menu</button></header><nav class="side" aria-label="Main"><div class="brand">${esc(D.settings.school)}</div>${NAV[me.role].map(p=>`<button class="${p===page?'on':''}" onclick="page='${p}';render()">${NM[p]}</button>`).join('')}<div class="who">${esc(me.name)} (${me.role})<br><button onclick="logout()" style="color:#fff;text-decoration:underline;padding:.3rem 0">Log out</button></div></nav><main>${V[page]()}</main></div>`}
render();
</script></body></html>
